# 反向代理：唯一對外入口。頁面走 /，寫入、媒體與 JSON 走 /api/；兩者轉給同一個 web 服務。
# 只接受 localhost／127.0.0.1 這兩個 Host（擋 DNS rebinding）；compose 只把 80 綁在 127.0.0.1。

# web 容器重建後 IP 會變；透過 Docker 內建 DNS 持續重新解析，避免 502。
resolver 127.0.0.11 valid=10s ipv6=off;

upstream web {
    zone web 64k;
    server web:8501 resolve;
    keepalive 16;
}

server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 8080;
    server_name localhost 127.0.0.1;
    server_tokens off;

    # Host 原樣轉送（含非預設連接埠），應用程式才能比對 Origin 與 Host。
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 跨站檢查要用的標頭，明確轉送。
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;

    location /api/ {
        # 上傳（音訊、字幕）直接串流給應用程式，大小上限與 MAX_UPLOAD_MB 一致。
        client_max_body_size 2048m;
        proxy_request_buffering off;
        # 大檔上傳與匯出仍在請求內完成，可能需要數分鐘；匯入後的處理改由 worker 在背景執行。
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_pass http://web;
    }

    location /static/ {
        expires 1h;
        proxy_pass http://web;
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }
        client_max_body_size 1m;
        proxy_read_timeout 120s;
        proxy_pass http://web;
    }
}
