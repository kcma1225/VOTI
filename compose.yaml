# VOTI — docker compose up -d --build    → http://<host>:8080 (behind the TLS proxy for voti.gugulu.tw)
# GPU: docker compose -f compose.yaml -f compose.gpu.yaml up -d --build
# Only nginx publishes a port; everything else stays on the internal network.
name: voti

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    args:
      TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
  image: voti-backend:${TORCH_VARIANT:-cpu}
  init: true
  restart: unless-stopped
  # workers requeue their running job on SIGTERM within VOTI_SHUTDOWN_GRACE_SEC (8 s) — keep this above it
  stop_grace_period: 20s
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://voti:${POSTGRES_PASSWORD:-voti}@db:5432/voti
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://rustfs:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-voti}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-voti-secret-change-me}
    S3_BUCKET: voti
    LEGACY_ML_URL: http://legacy-ml:8600
    MODEL_CACHE: /models
    HF_HOME: /models/hf
    TORCH_HOME: /models/torch
    WORK_DIR: /work
  volumes:
    - ${MODELS_DIR:-./models}:/models
  tmpfs:
    - /work:size=20g,uid=1000,gid=1000
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
    rustfs: {condition: service_started}

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: voti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voti}
      POSTGRES_DB: voti
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voti -d voti"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-voti}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-voti-secret-change-me}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - objects:/data

  legacy-ml:
    build:
      context: services/legacy-ml
      args:
        TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
    image: voti-legacy-ml:${TORCH_VARIANT:-cpu}
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-voti}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-voti-secret-change-me}
      S3_BUCKET: voti
      MODEL_CACHE: /models
      HF_HOME: /models/hf
      TORCH_HOME: /models/torch
    volumes:
      - ${MODELS_DIR:-./models}:/models
    depends_on:
      rustfs: {condition: service_started}

  api:
    <<: *backend
    command: ["uvicorn", "voti.api.app:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # YouTube work is split so scans, caption details and downloads never wait on each other.
  worker-scan:
    <<: *backend
    command: ["python", "-m", "voti.workers.run", "--queues", "scan,detail"]
    deploy:
      replicas: ${SCAN_WORKERS:-3}

  worker-download:
    <<: *backend
    command: ["python", "-m", "voti.workers.run", "--queues", "download"]
    deploy:
      replicas: ${DOWNLOAD_WORKERS:-2}

  worker-audio:
    <<: *backend
    command: ["python", "-m", "voti.workers.run", "--queues", "audio,export"]
    deploy:
      replicas: ${AUDIO_WORKERS:-2}

  worker-ml:
    <<: *backend
    command: ["python", "-m", "voti.workers.run", "--queues", "ml"]

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: voti-web:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
  objects:
