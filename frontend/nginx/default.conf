# VOTI web: SPA + reverse proxy to the API. Listens on 8080 (nginx-unprivileged, read-only rootfs, /tmp is tmpfs).
# TLS terminates at an upstream proxy which forwards the original Host and X-Forwarded-Proto.

# Scheme the browser actually used: trust the upstream proxy's header when present.
map $http_x_forwarded_proto $voti_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $voti_proto $voti_hsts {
    https   "max-age=31536000";
    default "";
}
# Keep upstream keep-alive working; only send "Connection: upgrade" for websocket upgrades.
map $http_upgrade $voti_connection {
    default upgrade;
    ""      "";
}

server {
    listen 8080 default_server;
    server_name _;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    # Host is NOT restricted here (the API enforces its allowlist), but requests without any Host header are dropped.
    if ($http_host = "") {
        return 444;
    }

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml font/ttf;

    # Docker's embedded DNS: re-resolve "api" so API container restarts / IP changes don't break the proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ─── API ───
    location /api/ {
        set $voti_api http://api:8000;
        proxy_pass $voti_api;                 # variable without URI → original request URI is passed through

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;     # original Host (incl. port) for the API's Origin/Host checks
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $voti_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $voti_connection;

        client_max_body_size 5m;              # cookies.txt upload
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 3600s;             # long export / audio downloads
        proxy_buffering off;                  # stream large responses; nothing is written to the read-only disk
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # ─── hashed build assets: cache forever ───
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ─── other static files (favicon, theme-init.js): short cache ───
    location ~* \.(?:js|css|svg|png|ico|woff2?|txt)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ─── SPA: history-API fallback; index.html is never cached ───
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
